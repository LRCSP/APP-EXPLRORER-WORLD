<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GEO·INTEL — briefing</title>
<style>
  :root{
    --bg:#071324; --bg2:#0b1c34; --panel:#0e2240; --line:#1d3559;
    --txt:#eaf1fb; --muted:#94a7c6; --accent:#5aa2ff; --accent2:#2f6fe0;
    --red:#ff5d63; --amber:#ffb443; --green:#37d39b; --grid:rgba(120,160,220,.12);
    --globeline:rgba(120,170,235,.18);
  }
  [data-theme="light"]{
    --bg:#ffffff; --bg2:#f4f7fc; --panel:#ffffff; --line:#dde5f1;
    --txt:#0a1322; --muted:#3f5273; --accent:#1f6fe0; --accent2:#0e4fc0;
    --grid:rgba(20,50,110,.10); --globeline:rgba(20,60,130,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .5s,color .5s}
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  #stars{position:fixed;inset:0;z-index:-2;opacity:.5}[data-theme="light"] #stars{opacity:0}
  .aura{position:fixed;z-index:-1;width:60vw;height:60vw;border-radius:50%;filter:blur(130px);opacity:.14;background:radial-gradient(circle,var(--accent2),transparent 62%);top:-12vw;right:-10vw}
  #prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line);gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .nav{display:flex;gap:8px;align-items:center}
  .pill,.login{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}
  .langbtn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px;padding:2px 6px}
  .langbtn.on{color:var(--accent)}
  .login{background:var(--accent2);color:#fff;border:none}
  .hero{min-height:92vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:20px;position:relative}
  .kicker{color:var(--accent);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px}
  .hero h1{font-size:clamp(34px,5vw,66px);line-height:1.02;font-weight:800;letter-spacing:-1.2px}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--muted);font-size:18px;margin-top:20px;max-width:520px}
  .cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:12px 20px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--line);color:var(--txt);text-decoration:none}
  .btn.primary{background:var(--accent2);color:#fff;border:none}
  .gen{color:var(--muted);font-size:12.5px}
  #globe{width:100%;max-width:520px;aspect-ratio:1;margin-left:auto;display:block}
  section.block{padding:96px 0;border-top:1px solid var(--line);position:relative}
  .eyebrow{color:var(--accent);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
  .block h2{font-size:clamp(24px,3.2vw,40px);font-weight:800;letter-spacing:-.5px;max-width:780px}
  .block .lead{color:var(--muted);font-size:16px;margin-top:12px;max-width:640px}
  .reveal{opacity:0;transform:translateY(34px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .tab{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.2s}
  .tab .d{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .tab.on{border-color:var(--accent);color:var(--txt)}
  .tab.on .d{color:var(--accent)}
  .events{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .ev .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ev .tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .ev .sev{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .ev h3{font-size:17px;margin:12px 0 6px;font-weight:700;line-height:1.3}
  .ev .res{color:var(--muted);font-size:14px;margin-bottom:14px}
  .ev .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ev .c{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px}
  .ev .c b{display:block;color:var(--accent);font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .ev .c span{font-size:13.5px}
  .ev .src{margin-top:14px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding-top:10px;border-top:1px solid var(--line);gap:10px}
  .ev .src a{color:var(--accent);text-decoration:none;font-weight:600}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;position:relative;overflow:hidden}
  .chart .top{display:flex;align-items:flex-end;justify-content:space-between}
  .chart .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .chart .price{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
  .chart .unit{color:var(--muted);font-size:11px;margin-top:2px}
  .chart .chg{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
  .chart canvas{width:100%;height:120px;display:block;margin-top:6px}
  .up{color:var(--green)} .down{color:var(--red)}
  .hist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .hrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .hrow .lock{color:var(--muted);font-size:12px}
  footer{padding:48px 0;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:13px}
  @media(max-width:820px){
    .wrap{padding:0 16px}
    .hero{grid-template-columns:1fr;min-height:auto;padding-top:88px;gap:6px}
    #globe{order:-1;max-width:280px;margin:0 0 4px}
    section.block{padding:64px 0}
    .events,.charts,.ev .grid{grid-template-columns:1fr}
    header{padding:12px 14px}
  }
</style>
</head>

ução de Querosene de Aviação nos EUA Aumenta com Preços Elevados", "resumo": "A produção de querosene de aviação nos EUA atingiu recordes após o fechamento do Estreito de Ormuz, elevando os preços globais devido a preocupações com a oferta na Europa e Ásia. Grande parte dessa produção é exportada, mantendo os estoques domésticos acima da média.", "editoria": "Energia", "geografia": "Europa", "severidade": 2, "relevancia": 7, "impacto_custo": "Os custos de combustível, especialmente querosene de aviação, tendem a subir globalmente, afetando o custo final do frete aéreo e impactando indiretamente o transporte marítimo e terrestre com a realocação de suprimentos.", "impacto_cadeia": "A escassez ou o aumento do preço do querosene de aviação pode levar a restrições em rotas aéreas e custos adicionais para fretes urgentes, potencialmente sobrecarregando outras modalidades logísticas.", "exposicao_cyber": "Nenhuma exposição direta a riscos cibernéticos identificada neste evento.", "acao_recomendada": "Monitore os preços globais de combustíveis e revise contratos de fornecimento de diesel/querosene, considerando diversificar rotas de transporte e planejar estoques de segurança para mitigar volatilidade de custos.", "fonte": "EIA — Today in Energy", "url": "https://www.eia.gov/todayinenergy/detail.php?id=67764", "idioma_original": "en", "titulo_original": "U.S. jet fuel production rises after prices doubled in March"}], "en": [{"titulo": "Eneos Seeks Oil Alternatives Amid Hormuz Strait Risks", "resumo": "Japan's largest oil refiner, Eneos, plans to diversify its crude oil supply, reducing Middle East dependency following supply shocks through the Strait of Hormuz. This move aims to mitigate risks in a volatile geopolitical landscape.", "editoria": "Oil", "geografia": "Japan", "severidade": 4, "relevancia": 8, "impacto_custo": "Oil supply instability and potential disruptions can drive up diesel and other fuel prices, directly increasing transport and logistics operating costs.", "impacto_cadeia": "Oil supply routes may be reconfigured, affecting freight availability and cost. Delivery lead times could be impacted by congestion at alternative ports or longer transit times.", "exposicao_cyber": "Not directly exposed, but conflicts in oil-producing regions could lead to cyberattacks on critical infrastructure, indirectly impacting the global supply chain.", "acao_recomendada": "Assess the need to renegotiate fuel supply contracts to secure price stability. Map out alternative logistics routes and monitor volatility in sea and land freight costs.", "fonte": "OilPrice — Energy News", "url": "https://oilprice.com/Latest-Energy-News/World-News/Japans-Top-Oil-Refiner-Eyes-a-Post-Hormuz-Future.html", "idioma_original": "en", "titulo_original": "Japan's Top Oil Refiner Eyes a Post-Hormuz Future"}, {"titulo": "Oil Prices Spike Amidst US-Iran Talks on Gulf Attack Suspension", "resumo": "Oil price volatility is increasing as the US and Iran discuss a deal to suspend attacks in the Gulf. This can directly impact fuel costs.", "editoria": "Oil", "geografia": "EUA/Irã", "severidade": 4, "relevancia": 8, "impacto_custo": "Rising oil prices increase the cost of diesel and other fuels, directly impacting freight budgets and logistics operations.", "impacto_cadeia": "Shipping and air routes in the Persian Gulf may face disruptions or diversions, delaying delivery lead times and increasing supply chain complexity.", "exposicao_cyber": "No direct cyber exposure identified from this event.", "acao_recomendada": "Closely monitor fuel quotes and review supply contracts. Evaluate alternative routes and anticipate potential delivery delays.", "fonte": "Google News — Oil / OPEC / Crude", "url": "https://news.google.com/rss/articles/CBMidkFVX3lxTFB0azJlM0sxUTQ0ZTdNWWtDdWR4bUZXX2NQYnEwNjctS3M3dnpLM1N0U2Z0Q3NFNGt0a2pNcXdVcTYzU2tCNzlsZnNSV2JYbVdJb2RCN3ZudWE5Y25kU2Rjb3NEQkNxaC05OWUwMkI1SEhWWGJ2SUE?oc=5", "idioma_original": "en", "titulo_original": "Oil Prices Rise as U.S. and Iran Discuss Deal to Suspend Gulf Attacks - The New York Times"}, {"titulo": "Oil Prices Surge, Affecting Transport Costs", "resumo": "A deal between the U.S. and Iran to halt attacks has pushed oil prices above $70 per barrel. This price increase will directly impact fuel costs for your transport and logistics operations.", "editoria": "Oil", "geografia": "EUA/Irã", "severidade": 4, "relevancia": 8, "impacto_custo": "Higher oil prices will translate into increased diesel and fuel expenses, directly affecting your company's profit margins.", "impacto_cadeia": "Road and sea freight costs will rise, potentially causing delivery delays and requiring renegotiation of contracts with clients and suppliers.", "exposicao_cyber": "There is no direct cybersecurity impact from this specific event.", "acao_recomendada": "Immediately assess the need to pass on increased fuel costs in your tariffs. Consider renegotiating freight contracts and exploring alternative routes less exposed to price volatility.", "fonte": "Google News — Oil / OPEC / Crude", "url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxOTWJRcFBwNnR2cWRJVkJQb3VRQmJiNkI3cHR6X3pGWGU3NWp0YllOaDZUdWdvZ0Z5TldETFgta2U2WUR4Nnh0VEZxQXB0TmJpRWhlM1Y2M1hBSk5PSnFwWlktUGEtNEo4djBOdUlJVklqM1VaWEoxaXRPMnRZbllLNGJaTkh4WUtERUV6MUEzUHJET3lraXNVQjRhbEtFU2150gGmAUFVX3lxTFBZcmZVZ2kzRjRkT1IzYzRMWnBBX25SSklTTk43WXV2VnRQN1k0clNnOHp3YUhIN214clJOU1BONTlOVG1TRXlEMXR3UkpiVURPb24zVjJjblpJUkw4WTVpZ3U4ZnJ6MXNYbEpNcVJPNmVVVGw3MlBJU1pybWlqN3BjbTNzVFRUV3JxQXZxaVpEXzJiQ0NxeVlTTWJ0UVZVc1hTNkdNTUE?oc=5", "idioma_original": "en", "titulo_original": "Oil prices rise as U.S. and Iran reach deal to halt attacks, U.S. oil above $70 per barrel again - CNBC"}, {"titulo": "Gold Price Decline Signals Commodity Market Volatility", "resumo": "The recent drop in gold prices, exceeding 22% since late February, reflects global market instability. This volatility can impact input costs and freight pricing.", "editoria": "Raw Materials", "geografia": "Global", "severidade": 4, "relevancia": 7, "impacto_custo": "Diesel and other fuel costs, often tied to commodity benchmarks, may become more volatile. Monitor fuel prices closely to adjust cost planning.", "impacto_cadeia": "Commodity market instability can lead to fluctuating freight costs and raw material prices for packaging or equipment. This may affect the predictability of delivery lead times.", "exposicao_cyber": "Global economic volatility can increase the sophistication of cyberattacks aimed at causing instability or stealing sensitive financial data.", "acao_recomendada": "Explore options for renegotiating fuel supply contracts with fixed prices or those indexed to more stable periods. Consider diversifying input suppliers to mitigate price and availability risks.", "fonte": "Mining.com — News", "url": "https://www.mining.com/gold-price-falls-back-to-4000-on-renewed-mideast-tensions/", "idioma_original": "en", "titulo_original": "Gold price falls nearly 2% as rebound proves short-lived"}, {"titulo": "Iran Rushes Oil Exports Amidst Negotiation Window", "resumo": "Iran is rapidly increasing its oil exports following an agreement to enter negotiations with the US. The easing of sanctions has allowed the country to ship millions of barrels, potentially boosting revenue as crude discounts have narrowed.", "editoria": "Energy", "geografia": "Irã", "severidade": 4, "relevancia": 7, "impacto_custo": "The return of Iranian oil to the market could pressure global fuel and diesel prices, directly impacting freight and transport operational costs.", "impacto_cadeia": "Increased oil supply might shift shipping routes and tanker availability, potentially affecting delivery lead times and global fuel logistics.", "exposicao_cyber": "Heightened Iranian commercial activity could expose energy infrastructure to increased cyber risks, necessitating vigilance.", "acao_recomendada": "Closely monitor fluctuations in diesel and freight prices. Assess the need to adjust routes or renegotiate logistics contracts to mitigate potential cost increases.", "fonte": "OilPrice — Energy News", "url": "https://oilprice.com/Energy/Energy-General/Tehran-Is-Racing-the-Clock-to-Export-as-Much-Oil-as-Possible.html", "idioma_original": "en", "titulo_original": "Tehran Is Racing the Clock to Export as Much Oil as Possible"}, {"titulo": "US Jet Fuel Production Surges Amidst High Prices", "resumo": "US jet fuel production has hit record highs following the Strait of Hormuz closure, driving global prices up due to supply concerns in Europe and Asia. Much of this output is exported, keeping domestic inventories above average.", "editoria": "Energy", "geografia": "Europa", "severidade": 2, "relevancia": 7, "impacto_custo": "Global fuel costs, particularly jet fuel, are likely to increase, affecting overall air freight expenses and indirectly impacting sea and land transport through supply reallocation.", "impacto_cadeia": "Jet fuel scarcity or price spikes may lead to restrictions on air routes and higher costs for urgent freight, potentially straining other logistics modes.", "exposicao_cyber": "No direct exposure to cyber risks identified with this event.", "acao_recomendada": "Monitor global fuel prices and review diesel/jet fuel supply contracts, consider diversifying transport routes and planning for safety stock to mitigate cost volatility.", "fonte": "EIA — Today in Energy", "url": "https://www.eia.gov/todayinenergy/detail.php?id=67764", "idioma_original": "en", "titulo_original": "U.S. jet fuel production rises after prices doubled in March"}]}}, {"id": "pme", "name": {"pt": "Pequeno/Médio Empresário", "en": "Small/Medium Business"}, "desc": {"pt": "Custo, insumos, cadeia e segurança digital.", "en": "Cost, inputs, supply chain and digital security."}, "events": {"pt": [{"titulo": "Vulnerabilidade Crítica em Software de Suporte Permite Roubo de Dados", "resumo": "Um novo malware, TaskWeaver e Djinn Stealer, está sendo distribuído globalmente ao explorar uma falha grave (CVE-2026-48558) em um software de suporte remoto. Esta vulnerabilidade permite que invasores ignorem autenticação para acessar sistemas.", "editoria": "Segurança Digital", "geografia": "Global", "severidade": 10, "relevancia": 9, "impacto_custo": "Custos com recuperação de dados e sistemas, além de possíveis multas por vazamento de informações sensíveis, podem ser significativos. A interrupção das operações também gera perdas diretas.", "impacto_cadeia": "Se seus fornecedores usam o software afetado, seus próprios dados e operações podem ser comprometidos indiretamente. Verifique a segurança dos parceiros de negócio que acessam sua rede.", "exposicao_cyber": "Sistemas que utilizam o software SimpleHelp, especialmente com a funcionalidade OpenID Connect desprotegida, estão em alto risco de acesso não autorizado e roubo de dados.", "acao_recomendada": "Aplique imediatamente as atualizações de segurança para o software SimpleHelp. Revise acessos remotos e autenticações; considere multi-fator para acesso à rede.", "fonte": "The Hacker News", "url": "https://thehackernews.com/2026/06/attackers-exploit-simplehelp-cve-2026.html", "idioma_original": "en", "titulo_original": "Attackers Exploit SimpleHelp CVE-2026-48558 to Deploy TaskWeaver and Djinn Stealer"}, {"titulo": "Falha em Argo CD permite controle de clusters Kubernetes", "resumo": "Uma falha crítica e sem correção no Argo CD, ferramenta comum para implantação em Kubernetes, pode permitir que atacantes não autenticados assumam o controle total de seus clusters. A vulnerabilidade afeta o componente repo-server e requer acesso à rede interna para exploração.", "editoria": "Segurança Digital", "geografia": "Global", "severidade": 9, "relevancia": 9, "impacto_custo": "A exploração dessa falha pode resultar em indisponibilidade de serviços, exigindo custos significativos de recuperação e restauração de dados. A interrupção operacional pode gerar perda direta de receita.", "impacto_cadeia": "Se a sua operação depende de serviços hospedados em Kubernetes gerenciados por Argo CD, uma falha pode interromper a disponibilidade de fornecedores ou parceiros críticos. Avalie a dependência de infraestrutura exposta.", "exposicao_cyber": "O risco principal é a tomada de controle completa da infraestrutura de TI, permitindo acesso a dados sensíveis, interrupção de operações e implantação de malware. A ausência de correção eleva o risco imediatamente.", "acao_recomendada": "Priorize a segmentação de rede para isolar o componente repo-server do Argo CD. Revise os controles de acesso à rede interna e considere a adoção de soluções de segurança de endpoint e monitoramento de rede mais rigorosos.", "fonte": "The Hacker News", "url": "https://thehackernews.com/2026/07/unpatched-argo-cd-repo-server-flaw.html", "idioma_original": "en", "titulo_original": "Unpatched Argo CD Repo-Server Flaw Could Let Attackers Take Over Kubernetes Clusters"}, {"titulo": "Falha Crítica no SharePoint da Microsoft Exploatada Ativamente", "resumo": "Uma vulnerabilidade grave no Microsoft SharePoint, que permite execução remota de código, está sendo ativamente explorada por cibercriminosos. A falha foi corrigida em maio, mas ainda representa um risco significativo se não atualizada.", "editoria": "Segurança Digital", "geografia": "Global", "severidade": 5, "relevancia": 9, "impacto_custo": "A exploração desta falha pode levar à interrupção dos seus sistemas de colaboração, resultando em perda de produtividade e potencial custo de recuperação de dados ou sistemas. O tempo de inatividade impacta diretamente a receita operacional.", "impacto_cadeia": "Se seus fornecedores ou clientes utilizam versões desatualizadas do SharePoint, eles podem ser comprometidos. Isso pode interromper a comunicação e a troca de informações essenciais, afetando sua cadeia de suprimentos digital.", "exposicao_cyber": "Seus dados e sistemas podem ser acessados, modificados ou sequestrados por agentes maliciosos, levando à perda de confidencialidade e integridade das informações.", "acao_recomendada": "Verifique imediatamente se todos os servidores SharePoint da sua empresa foram atualizados com os patches de segurança mais recentes. Considere auditorias de segurança regulares para identificar e mitigar riscos.", "fonte": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/cisa-microsoft-sharepoint-rce-flaw-now-actively-exploited/", "idioma_original": "en", "titulo_original": "CISA: Microsoft SharePoint RCE flaw now actively exploited"}, {"titulo": "Resposta da OpenAI a ataque à cadeia de suprimentos de software", "resumo": "A OpenAI detalha sua resposta ao ataque 'Mini Shai-Hulud' à cadeia de suprimentos TanStack. Foram implementadas proteções para sistemas e certificados, e usuários de macOS precisam atualizar apps da OpenAI até 12 de junho de 2026 para mitigar riscos.", "editoria": "Tecnologia & Inovação", "geografia": "Global", "severidade": 4, "relevancia": 9, "impacto_custo": "Custos podem aumentar devido à necessidade de auditorias de segurança mais rigorosas em softwares de terceiros. Invista em ferramentas de verificação de dependências para evitar gastos com remediação.", "impacto_cadeia": "Ataques à cadeia de suprimentos expõem a vulnerabilidade em softwares de código aberto usados por muitos negócios. Verifique a segurança dos seus fornecedores de software e componentes para garantir a continuidade.", "exposicao_cyber": "Este incidente demonstra o risco crescente de comprometimento via bibliotecas de software. Sua empresa está exposta se utiliza componentes de terceiros sem validação de segurança adequada.", "acao_recomendada": "Avalie e fortaleça a segurança dos seus softwares de terceiros, priorizando atualizações críticas e implementando políticas de validação de código. Considere treinar sua equipe sobre riscos de segurança na cadeia de suprimentos.", "fonte": "OpenAI News", "url": "https://openai.com/index/our-response-to-the-tanstack-npm-supply-chain-attack", "idioma_original": "en", "titulo_original": "Our response to the TanStack npm supply chain attack"}, {"titulo": "Crise Energética Ameaça Segurança Alimentar Global com Escassez de Fertilizantes", "resumo": "A crise energética global está a agravar a escassez de fertilizantes, impactando diretamente a produção de alimentos. Esta situação representa um risco significativo para a segurança alimentar em todo o mundo.", "editoria": "Alimentos", "geografia": "Global", "severidade": 5, "relevancia": 8, "impacto_custo": "O custo dos fertilizantes aumentou drasticamente devido à alta nos preços da energia, impactando a rentabilidade e os custos de produção no setor alimentício.", "impacto_cadeia": "A escassez de fertilizantes pode levar a quebras de safra e menor disponibilidade de insumos agrícolas, afetando toda a cadeia produtiva de alimentos.", "exposicao_cyber": "Não há exposição cibernética direta relatada neste evento.", "acao_recomendada": "Diversifique seus fornecedores de insumos e considere contratos de longo prazo para mitigar a volatilidade de preços e garantir o abastecimento.", "fonte": "Google News — Food Security / Grain Exports", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1VUkZJLWN6SDJHckc1dG5CYUZ5bXlaVGNFVzN3OEd6Y0JhZXlvSVJTZ19BWDRFcW1QQkU5dzd0dGRGVWx3QWJsWnlsYlh1MDlWUjVBWVRuNzFNa0hWMTRN?oc=5", "idioma_original": "en", "titulo_original": "How fertilizer shortages caused by the energy crisis threaten food security - Nature"}, {"titulo": "Investigação aponta crimes de guerra em ataques da Junta de Mianmar contra agricultores", "resumo": "Uma nova investigação da Fortify Rights indica que ataques deliberados da Junta Militar de Mianmar contra agricultores podem configurar crimes de guerra. Isso levanta sérias preocupações sobre a estabilidade e segurança no país.", "editoria": "Alimentos", "geografia": "Global", "severidade": 5, "relevancia": 8, "impacto_custo": "A escalada da violência e potenciais crimes de guerra podem levar à interrupção do fornecimento de insumos agrícolas essenciais, aumentando seus custos.", "impacto_cadeia": "O conflito em Mianmar ameaça a produção e exportação de alimentos, podendo desestabilizar cadeias de suprimentos globais e locais, impactando a disponibilidade de certos produtos.", "exposicao_cyber": "Conflitos regionais podem aumentar a atividade cibernética maliciosa, com tentativas de phishing ou malware visando empresas com operações ou cadeias de suprimentos afetadas.", "acao_recomendada": "Monitore ativamente fornecedores em zonas de conflito e diversifique suas fontes de suprimento para mitigar riscos de interrupção e aumento de custos.", "fonte": "Google News — Food Security / Grain Exports", "url": "https://news.google.com/rss/articles/CBMiXkFVX3lxTE0tVGw4SExEY0lXTGV6RTBpWUw4MFpEUnpVZTN5aEM3QUpETk4tVEJVTGFsOVk0aS1BQTl4cFdkOHNiZmp2cmx1endQY0tEUHdrZ2xZOTdNREtQRmpVeXc?oc=5", "idioma_original": "en", "titulo_original": "Myanmar Junta Attacks on Farmers May Constitute War Crimes, New Investigation Finds - Fortify Rights"}], "en": [{"titulo": "Critical Support Software Flaw Enables Data Theft", "resumo": "New malware, TaskWeaver and Djinn Stealer, is being distributed globally by exploiting a severe flaw (CVE-2026-48558) in remote support software. This vulnerability allows attackers to bypass authentication and access systems.", "editoria": "Digital Security", "geografia": "Global", "severidade": 10, "relevancia": 9, "impacto_custo": "Costs for data and system recovery, plus potential fines for sensitive data breaches, can be substantial. Operational downtime also leads to direct financial losses.", "impacto_cadeia": "If your suppliers use the affected software, your own data and operations could be indirectly compromised. Verify the security of business partners accessing your network.", "exposicao_cyber": "Systems using SimpleHelp software, particularly with unprotected OpenID Connect functionality, face a high risk of unauthorized access and data theft.", "acao_recomendada": "Immediately apply security patches for SimpleHelp software. Review remote access and authentication methods; consider multi-factor authentication for network access.", "fonte": "The Hacker News", "url": "https://thehackernews.com/2026/06/attackers-exploit-simplehelp-cve-2026.html", "idioma_original": "en", "titulo_original": "Attackers Exploit SimpleHelp CVE-2026-48558 to Deploy TaskWeaver and Djinn Stealer"}, {"titulo": "Argo CD Flaw Allows Kubernetes Cluster Takeover", "resumo": "A critical unpatched flaw in Argo CD, a common Kubernetes deployment tool, could allow unauthenticated attackers to gain full control of your clusters. The vulnerability affects the repo-server component and requires internal network access to exploit.", "editoria": "Digital Security", "geografia": "Global", "severidade": 9, "relevancia": 9, "impacto_custo": "Exploitation of this flaw can lead to service unavailability, incurring significant recovery and data restoration costs. Operational disruption can generate direct revenue loss.", "impacto_cadeia": "If your operations rely on Kubernetes services managed by Argo CD, a breach could disrupt the availability of critical suppliers or partners. Assess your reliance on exposed infrastructure.", "exposicao_cyber": "The primary risk is complete takeover of your IT infrastructure, enabling access to sensitive data, operational disruption, and malware deployment. The lack of a patch heightens the risk immediately.", "acao_recomendada": "Prioritize network segmentation to isolate the Argo CD repo-server component. Review internal network access controls and consider implementing stricter endpoint security and network monitoring solutions.", "fonte": "The Hacker News", "url": "https://thehackernews.com/2026/07/unpatched-argo-cd-repo-server-flaw.html", "idioma_original": "en", "titulo_original": "Unpatched Argo CD Repo-Server Flaw Could Let Attackers Take Over Kubernetes Clusters"}, {"titulo": "Critical Microsoft SharePoint Flaw Actively Exploited", "resumo": "A severe vulnerability in Microsoft SharePoint, allowing remote code execution, is being actively exploited by cybercriminals. The flaw was patched in May but still poses a significant risk if unaddressed.", "editoria": "Digital Security", "geografia": "Global", "severidade": 5, "relevancia": 9, "impacto_custo": "Exploitation of this flaw can lead to disruption of your collaboration systems, resulting in lost productivity and potential data or system recovery costs. Downtime directly impacts operating revenue.", "impacto_cadeia": "If your suppliers or clients use outdated SharePoint versions, they could be compromised. This may disrupt essential communication and information exchange, affecting your digital supply chain.", "exposicao_cyber": "Your data and systems could be accessed, modified, or ransomed by malicious actors, leading to loss of confidentiality and integrity of information.", "acao_recomendada": "Immediately verify that all company SharePoint servers have been updated with the latest security patches. Consider regular security audits to identify and mitigate risks.", "fonte": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/cisa-microsoft-sharepoint-rce-flaw-now-actively-exploited/", "idioma_original": "en", "titulo_original": "CISA: Microsoft SharePoint RCE flaw now actively exploited"}, {"titulo": "OpenAI's Response to Software Supply Chain Attack", "resumo": "OpenAI details its response to the TanStack 'Mini Shai-Hulud' supply chain attack, outlining system and certificate protections. macOS users must update OpenAI apps by June 12, 2026, to mitigate risks.", "editoria": "Technology & Innovation", "geografia": "Global", "severidade": 4, "relevancia": 9, "impacto_custo": "Costs may rise due to stricter security audits on third-party software. Invest in dependency scanning tools to avoid remediation expenses.", "impacto_cadeia": "Supply chain attacks highlight vulnerabilities in open-source software used by many businesses. Verify the security of your software suppliers and components to ensure continuity.", "exposicao_cyber": "This incident shows the growing risk of compromise via software libraries. Your business is exposed if you use third-party components without proper security validation.", "acao_recomendada": "Assess and strengthen the security of your third-party software, prioritizing critical updates and implementing code validation policies. Consider training your team on supply chain security risks.", "fonte": "OpenAI News", "url": "https://openai.com/index/our-response-to-the-tanstack-npm-supply-chain-attack", "idioma_original": "en", "titulo_original": "Our response to the TanStack npm supply chain attack"}, {"titulo": "Energy Crisis Threatens Global Food Security Amid Fertilizer Shortages", "resumo": "The global energy crisis is exacerbating fertilizer shortages, directly impacting food production. This situation poses a significant risk to worldwide food security.", "editoria": "Food", "geografia": "Global", "severidade": 5, "relevancia": 8, "impacto_custo": "Fertilizer costs have surged due to rising energy prices, impacting profitability and production expenses within the food sector.", "impacto_cadeia": "Fertilizer scarcity may lead to crop failures and reduced availability of agricultural inputs, affecting the entire food production supply chain.", "exposicao_cyber": "No direct cyber exposure is reported in relation to this event.", "acao_recomendada": "Diversify your input suppliers and explore long-term contracts to mitigate price volatility and ensure supply continuity.", "fonte": "Google News — Food Security / Grain Exports", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1VUkZJLWN6SDJHckc1dG5CYUZ5bXlaVGNFVzN3OEd6Y0JhZXlvSVJTZ19BWDRFcW1QQkU5dzd0dGRGVWx3QWJsWnlsYlh1MDlWUjVBWVRuNzFNa0hWMTRN?oc=5", "idioma_original": "en", "titulo_original": "How fertilizer shortages caused by the energy crisis threaten food security - Nat /* ---- market charts ---- */
function drawLine(ctx,W,H,data,prog){
  const dpr=window.devicePixelRatio||1;ctx.canvas.width=W*dpr;ctx.canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!data||data.length<2)return data?data[data.length-1]:0;
  const lo=Math.min(...data),hi=Math.max(...data),span=(hi-lo)||1,pad=8;
  const X=i=>pad+(W-2*pad)*(i/(data.length-1)),Y=v=>H-pad-(H-2*pad)*((v-lo)/span);
  ctx.strokeStyle=cssv('--grid');ctx.lineWidth=1;for(let g=0;g<=2;g++){const y=pad+(H-2*pad)*g/2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
  const n=clamp(prog,0,1)*(data.length-1),full=Math.floor(n),frac=n-full,col=cssv('--accent');
  let ex=X(full),ey=Y(data[full]);if(full<data.length-1){ex=lerp(X(full),X(full+1),frac);ey=lerp(Y(data[full]),Y(data[full+1]),frac);}
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));for(let i=1;i<=full;i++)ctx.lineTo(X(i),Y(data[i]));ctx.lineTo(ex,ey);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');ctx.lineTo(ex,H-pad);ctx.lineTo(X(0),H-pad);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));for(let i=1;i<=full;i++)ctx.lineTo(X(i),Y(data[i]));ctx.lineTo(ex,ey);ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.shadowColor=col;ctx.shadowBlur=9;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,3.6,0,7);ctx.fill();
  return full<data.length-1?lerp(data[full],data[full+1],frac):data[data.length-1];
}
const mkCards=[];
function renderMarket(){
  const box=document.getElementById('charts');box.innerHTML='';mkCards.length=0;
  (DATA.market||[]).forEach(m=>{
    const up=m.pct>=0;const el=document.createElement('div');el.className='chart reveal in';
    el.innerHTML=`<div class="top"><div><div class="label">${esc(m.name)}</div><div class="price">—</div></div>
      <div class="chg ${up?'up':'down'}">${up?'▲ +':'▼ '}${Math.abs(m.pct).toFixed(2)}%</div></div>
      <div class="unit">${esc(m.unit[LANG]||m.unit.pt||'')}</div><canvas></canvas>`;
    box.appendChild(el);
    mkCards.push({el,m,ctx:el.querySelector('canvas').getContext('2d'),price:el.querySelector('.price')});
  });
}

function render(){applyI18n();renderTabs();renderEvents();renderHist();renderMarket();}

function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const land=[];for(let lat=-56;lat<=80;lat+=2.6)for(let lon=-180;lon<=180;lon+=2.6){for(const k of CONT){if(pip(lon,lat,k.p)){const la=lat*Math.PI/180,lo=lon*Math.PI/180;land.push({x:Math.cos(la)*Math.sin(lo),y:Math.sin(la),z:Math.cos(la)*Math.cos(lo),c:k.c});break;}}}
const gl=document.getElementById('globe'),gx=gl.getContext('2d');let ang=-0.3,t=0;
function rot(p,ca,sa){return{x:p.x*ca+p.z*sa,y:p.y,z:-p.x*sa+p.z*ca};}
function drawGlobe(){const W=gl.width,H=gl.height,cx=W/2,cy=H/2,R=W*0.40;gx.clearRect(0,0,W,H);ang+=0.0022;t+=0.05;const ca=Math.cos(ang),sa=Math.sin(ang);
  const og=gx.createRadialGradient(cx-R*.3,cy-R*.3,R*.2,cx,cy,R);og.addColorStop(0,'rgba(30,60,110,.28)');og.addColorStop(1,'rgba(6,14,30,.10)');gx.fillStyle=og;gx.beginPath();gx.arc(cx,cy,R,0,7);gx.fill();
  gx.strokeStyle=cssv('--globeline');gx.lineWidth=1;
  for(let m=-150;m<=180;m+=30){gx.beginPath();let s=false;for(let la=-90;la<=90;la+=4){const r=rot({x:Math.cos(la*Math.PI/180)*Math.sin(m*Math.PI/180),y:Math.sin(la*Math.PI/180),z:Math.cos(la*Math.PI/180)*Math.cos(m*Math.PI/180)},ca,sa);if(r.z<0){s=false;continue;}const X=cx+r.x*R,Y=cy-r.y*R;s?gx.lineTo(X,Y):gx.moveTo(X,Y);s=true;}gx.stroke();}
  for(const p of land){const r=rot(p,ca,sa);if(r.z<-0.02)continue;const d=(r.z+1)/2;gx.globalAlpha=.25+d*.75;gx.fillStyle=p.c;gx.beginPath();gx.arc(cx+r.x*R,cy-r.y*R,1.5*(.5+d),0,7);gx.fill();}
  gx.globalAlpha=1;
}

function loop(){const sy=scrollY,vh=innerHeight,dh=document.body.scrollHeight-vh;
  document.getElementById('prog').style.width=clamp(sy/dh,0,1)*100+'%';
  const ht=document.getElementById('heroText'),hp=clamp(sy/vh,0,1);ht.style.transform=`translateY(${sy*.2}px)`;ht.style.opacity=String(1-hp*.85);

  drawGlobe();
  mkCards.forEach(c=>{const r=c.el.getBoundingClientRect();const prog=clamp((vh*.9-r.top)/(vh*.5),0,1);const W=c.el.querySelector('canvas').clientWidth;c.price.textContent=fmtVal(c.m,drawLine(c.ctx,W,120,c.m.series,prog));});
  requestAnimationFrame(loop);
}
