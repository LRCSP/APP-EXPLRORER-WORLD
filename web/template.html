<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
<title>GEO·INTEL — Analista IA de mercado, risco e tecnologia para PMEs</title>
<meta name="description" content="Analista IA para pequenas e médias empresas: sinais de mercado, câmbio, commodities e tecnologia viram projeção, impacto e caminho de ação. Bilíngue PT/EN, por menos de R$30/mês." />
<meta property="og:title" content="GEO·INTEL — Analista IA para a sua empresa" />
<meta property="og:description" content="Sinais do mercado viram projeções e ações para a sua PME. Mercado, risco e tecnologia o dia todo, por menos de R$30/mês." />
<meta property="og:type" content="website" />
<meta name="robots" content="index,follow" />
<style>
  :root{
    --bg:#071324; --bg2:#0b1c34; --panel:#0e2240; --line:#1d3559;
    --txt:#eaf1fb; --muted:#94a7c6; --accent:#5aa2ff; --accent2:#2f6fe0;
    --red:#ff5d63; --amber:#ffb443; --green:#37d39b; --grid:rgba(120,160,220,.12);
    --globeline:rgba(120,170,235,.18);
  }
  [data-theme="light"]{
    --bg:#ffffff; --bg2:#f4f7fc; --panel:#ffffff; --line:#dde5f1;
    --txt:#0a1322; --muted:#3f5273; --accent:#1f6fe0; --accent2:#0e4fc0;
    --grid:rgba(20,50,110,.10); --globeline:rgba(20,60,130,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .5s,color .5s}
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  a{color:inherit}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  #stars{position:fixed;inset:0;z-index:-2;opacity:.5}[data-theme="light"] #stars{opacity:0}
  .aura{position:fixed;z-index:-1;width:60vw;height:60vw;border-radius:50%;filter:blur(130px);opacity:.14;background:radial-gradient(circle,var(--accent2),transparent 62%);top:-12vw;right:-10vw}
  #prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 26px;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line);gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .nav{display:flex;gap:8px;align-items:center}
  .pill{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:999px;overflow:hidden}
  .pill button,.iconbtn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px;padding:8px 12px}
  .pill button.on{color:var(--accent)}
  .iconbtn{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--txt)}
  .navcta{cursor:pointer;background:var(--accent2);color:#fff;border:none;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
  .hero{min-height:90vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:20px;position:relative}
  .kicker{color:var(--accent);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:clamp(30px,4.6vw,60px);line-height:1.04;font-weight:800;letter-spacing:-1.2px}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--muted);font-size:18px;margin-top:18px;max-width:540px}
  .cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);color:var(--txt);text-decoration:none;display:inline-block}
  .btn.primary{background:var(--accent2);color:#fff;border:none}
  .btn.wpp{border-color:var(--green);color:var(--green)}
  .gen{color:var(--muted);font-size:12.5px}
  #globe{width:100%;max-width:520px;aspect-ratio:1;margin-left:auto;display:block}
  section.block{padding:88px 0;border-top:1px solid var(--line);position:relative}
  .eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
  .block h2{font-size:clamp(23px,3vw,38px);font-weight:800;letter-spacing:-.5px;max-width:780px}
  .block .lead{color:var(--muted);font-size:16px;margin-top:12px;max-width:640px}
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
  .cardlite{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .cardlite .ic{font-size:22px} .cardlite b{display:block;margin:8px 0 4px} .cardlite span{color:var(--muted);font-size:13.5px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px;counter-reset:s}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
  .step::before{counter-increment:s;content:counter(s);position:absolute;top:-12px;left:16px;width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .step b{display:block;margin-bottom:4px} .step span{color:var(--muted);font-size:13.5px}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .tab{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;text-align:left}
  .tab .d{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .tab.on{border-color:var(--accent);color:var(--txt)}.tab.on .d{color:var(--accent)}
  .top3{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:22px}
  .top3 h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
  .top3 ol{margin:0;padding-left:20px} .top3 li{margin:6px 0;font-size:14.5px} .top3 li small{color:var(--muted)}
  .events{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .ev .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ev .tag{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .ev .sev{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
  .ev h3{font-size:17px;margin:12px 0 6px;font-weight:700;line-height:1.3}
  .ev .res{color:var(--muted);font-size:14px;margin-bottom:10px}
  .ev .act{font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .ev .act b{color:var(--accent)}
  .ev details{margin-top:12px}
  .ev summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
  .ev summary::-webkit-details-marker{display:none}
  .ev .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .ev .c{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px}
  .ev .c b{display:block;color:var(--accent);font-size:11px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
  .ev .c span{font-size:13.5px}
  .ev .src{margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:10px}
  .ev .src a{color:var(--accent);text-decoration:none;font-weight:600}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;position:relative;overflow:hidden}
  .chart .top{display:flex;align-items:flex-end;justify-content:space-between}
  .chart .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .chart .price{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
  .chart .unit{color:var(--muted);font-size:11px;margin-top:2px}
  .chart .chg{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
  .chart canvas{width:100%;height:120px;display:block;margin-top:6px}
  .up{color:var(--green)} .down{color:var(--red)}
  .beta{background:var(--panel);border:1px solid var(--accent);border-radius:18px;padding:26px;margin-top:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
  .beta .price b{font-size:30px} .beta .price span{color:var(--muted)}
  .beta .p2{color:var(--muted);font-size:14px;margin-top:4px}
  .hist{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .hrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .hrow .lock{color:var(--muted);font-size:12px}
  .disc{color:var(--muted);font-size:12.5px;margin-top:18px;max-width:820px}
  footer{padding:44px 0;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:13px}
  @media(max-width:860px){
    .wrap{padding:0 16px}
    .hero{grid-template-columns:1fr;min-height:auto;padding-top:84px;gap:6px}
    #globe{order:-1;max-width:250px;margin:0 0 4px}
    section.block{padding:60px 0}
    .events,.charts,.cols,.steps,.ev .grid{grid-template-columns:1fr}
    .navcta{display:none}
    header{padding:10px 14px}
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas><div class="aura" aria-hidden="true"></div><div id="prog" aria-hidden="true"></div>

<header>
  <div class="brand"><span class="dot" aria-hidden="true"></span>GEO<span style="opacity:.55">·</span>INTEL</div>
  <div class="nav">
    <div class="pill" role="group" aria-label="Idioma / Language">
      <button class="langbtn on" data-lang="pt" aria-pressed="true">PT</button>
      <button class="langbtn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Alternar tema claro/escuro">🌙</button>
    <a class="navcta" id="navCta" href="#" data-i="cta_free"></a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div id="heroText">
      <div class="kicker" data-i="kicker"></div>
      <h1 data-i="h1"></h1>
      <p data-i="sub"></p>
      <div class="cta">
        <a class="btn primary" id="ctaFree" href="#" data-i="cta_free"></a>
        <a class="btn" href="#brief" data-i="cta_today"></a>
        <a class="btn wpp" id="ctaWpp" href="#" data-i="cta_wpp"></a>
        <span class="gen" id="gen"></span>
      </div>
    </div>
    <canvas id="globe" width="1040" height="1040" aria-hidden="true"></canvas>
  </div>
</div>

<section class="block">
  <div class="wrap">
    <div class="eyebrow" data-i="pq_eyebrow"></div>
    <h2 data-i="pq_h"></h2>
    <div class="cols" id="audience"></div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="eyebrow" data-i="como_eyebrow"></div>
    <h2 data-i="como_h"></h2>
    <div class="steps" id="steps"></div>
  </div>
</section>

<section class="block" id="brief">
  <div class="wrap">
    <div class="eyebrow" data-i="brief_eyebrow"></div>
    <h2 data-i="brief_h"></h2>
    <p class="lead" data-i="brief_lead"></p>
    <div class="tabs" id="tabs" role="tablist" aria-label="Perfis"></div>
    <div class="top3" id="top3"></div>
    <div class="events" id="events"></div>
    <p class="disc" data-i="disc_text"></p>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="eyebrow" data-i="mkt_eyebrow"></div>
    <h2 data-i="mkt_h"></h2>
    <div class="charts" id="charts"></div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="eyebrow" data-i="beta_eyebrow"></div>
    <h2 data-i="beta_h"></h2>
    <div class="beta">
      <div class="price"><b data-i="beta_p1"></b> <span data-i="beta_p1b"></span><div class="p2" data-i="beta_p2"></div></div>
      <a class="btn primary" id="ctaFree2" href="#" data-i="cta_free"></a>
    </div>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="eyebrow" data-i="hist_eyebrow"></div>
    <h2 data-i="hist_h"></h2>
    <div class="hist" id="hist"></div>
  </div>
</section>

<footer><div class="wrap" data-i="footer"></div></footer>

<script>
const DATA = DATA_PLACEHOLDER;
const CTA = DATA.cta || {signup:"#", whatsapp:"#"};
const I18N = {
  pt:{
    cta_free:"Testar 7 dias grátis", cta_today:"Ver análise de hoje", cta_wpp:"Falar no WhatsApp",
    kicker:"Analista IA · mercado, risco & tecnologia",
    h1:'Um analista IA acompanhando <span>mercado, risco e tecnologia</span> para a sua empresa.',
    sub:"O dia todo, por menos de R$30/mês: sinais de mercado, câmbio, commodities e tecnologia viram projeção, impacto e caminho de ação para a sua PME.",
    pq_eyebrow:"Para quem é", pq_h:"Feito para pequenas e médias empresas.",
    audience:[["🏪","Comércio & varejo","Câmbio, consumo e custo de estoque."],["🏭","Indústria & agro","Insumos, commodities e energia."],["🚚","Logística & comex","Frete, rotas, sanções e tarifas."],["💼","Serviços & tech","Regulatório, tecnologia e concorrência."]],
    como_eyebrow:"Como funciona", como_h:"Do sinal à ação, todo dia.",
    steps:[["Sinais globais","Mercado, câmbio, commodities, tech — PT e EN."],["IA interpreta","Setor, geografia e severidade, sem repetição."],["Projeção & ação","Cenário provável, impacto e caminho de ação."],["Entrega no dia","Nos horários-chave — e-mail e WhatsApp/Telegram."]],
    brief_eyebrow:"Briefing do dia · amostra", brief_h:"Escolha o seu perfil.",
    brief_lead:"O mesmo dia, lido sob a ótica de quem decide. Fonte original sempre preservada.",
    mkt_eyebrow:"Mercado · 30 dias", mkt_h:"Câmbio, índices e commodities.",
    beta_eyebrow:"Beta fundador", beta_h:"Menos de R$30/mês.",
    beta_p1:"R$29,90/mês", beta_p1b:"· R$19,90 no beta fundador", beta_p2:"7 dias grátis para testar. Cancele quando quiser.",
    hist_eyebrow:"Histórico", hist_h:"Edições anteriores.",
    custo:"Custo", cadeia:"Cadeia", cyber:"Segurança", acao:"Ação",
    fonte:"fonte", ler:"abrir ↗", sev:"sev", detalhes:"Ver detalhes e fonte",
    top3:"Top 3 riscos de hoje", gerado:"Atualizado", lock:"histórico completo após login",
    mkt_err:"Cotações indisponíveis no momento — tente novamente mais tarde.",
    disc_text:"Conteúdo informativo, não é recomendação financeira nem jurídica. Fontes originais preservadas e sempre citadas.",
    footer:"GEO·INTEL — briefing bilíngue por perfil. Beta fundador; login e entrega diária nas próximas etapas."},
  en:{
    cta_free:"Start 7-day free trial", cta_today:"See today's analysis", cta_wpp:"Chat on WhatsApp",
    kicker:"AI analyst · markets, risk & technology",
    h1:'An AI analyst tracking <span>markets, risk and technology</span> for your business.',
    sub:"All day, for under R$30/month: signals from markets, FX, commodities and technology become projection, impact and an action path for your SME.",
    pq_eyebrow:"Who it's for", pq_h:"Built for small and medium businesses.",
    audience:[["🏪","Retail & commerce","FX, demand and inventory cost."],["🏭","Industry & agri","Inputs, commodities and energy."],["🚚","Logistics & trade","Freight, routes, sanctions and tariffs."],["💼","Services & tech","Regulation, technology and competition."]],
    como_eyebrow:"How it works", como_h:"From signal to action, every day.",
    steps:[["Global signals","Markets, FX, commodities, tech — PT and EN."],["AI interprets","Sector, geography and severity, no repetition."],["Projection & action","Likely scenario, impact and action path."],["Delivered on the day","At key hours — email and WhatsApp/Telegram."]],
    brief_eyebrow:"Today's briefing · sample", brief_h:"Choose your profile.",
    brief_lead:"The same day, read through a decision-maker's lens. Original source always preserved.",
    mkt_eyebrow:"Markets · 30 days", mkt_h:"FX, indices and commodities.",
    beta_eyebrow:"Founder beta", beta_h:"Under R$30/month.",
    beta_p1:"R$29.90/mo", beta_p1b:"· R$19.90 in founder beta", beta_p2:"7-day free trial. Cancel anytime.",
    hist_eyebrow:"History", hist_h:"Previous editions.",
    custo:"Cost", cadeia:"Supply", cyber:"Security", acao:"Action",
    fonte:"source", ler:"open ↗", sev:"sev", detalhes:"See details and source",
    top3:"Today's top 3 risks", gerado:"Updated", lock:"full history after login",
    mkt_err:"Quotes unavailable right now — please try again later.",
    disc_text:"Informational content, not financial or legal advice. Original sources preserved and always cited.",
    footer:"GEO·INTEL — bilingual briefing by profile. Founder beta; login and daily delivery next."},
};

let LANG="pt", PROFILE=(DATA.profiles[0]||{}).id;
const root=document.documentElement, cssv=n=>getComputedStyle(root).getPropertyValue(n).trim();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=s=>{s=String(s||"");return /^https?:\/\//i.test(s)?s:"#";};
const SEVC=s=>s>=5?"var(--red)":s>=4?"var(--amber)":s>=2?"var(--accent)":"var(--green)";

document.getElementById('themeBtn').onclick=()=>{const d=root.getAttribute('data-theme')==='dark';root.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'☀️':'🌙';};
document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;document.querySelectorAll('.langbtn').forEach(x=>{const on=x.dataset.lang===LANG;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});render();});

function applyI18n(){
  const t=I18N[LANG];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(t[k]!=null){if(k==='h1')el.innerHTML=t[k];else el.textContent=t[k];}});
  root.lang = LANG==='pt'?'pt-BR':'en';
  [document.getElementById('ctaFree'),document.getElementById('ctaFree2'),document.getElementById('navCta')].forEach(a=>{if(a)a.href=url(CTA.signup);});
  const w=document.getElementById('ctaWpp');if(w)w.href=url(CTA.whatsapp);
  const g=DATA.generated_at||''; document.getElementById('gen').textContent=g?`· ${t.gerado}: ${g.replace('T',' ').slice(0,16)}`:'';
}
function fill(id,items,fn){const box=document.getElementById(id);box.innerHTML='';items.forEach(it=>{const el=document.createElement('div');fn(el,it);box.appendChild(el);});}
function renderStatic(){
  const t=I18N[LANG];
  fill('audience',t.audience,(el,[ic,b,s])=>{el.className='cardlite reveal in';el.innerHTML=`<div class="ic">${ic}</div><b>${esc(b)}</b><span>${esc(s)}</span>`;});
  fill('steps',t.steps,(el,[b,s])=>{el.className='step reveal in';el.innerHTML=`<b>${esc(b)}</b><span>${esc(s)}</span>`;});
}
function renderTabs(){
  const box=document.getElementById('tabs');box.innerHTML='';
  DATA.profiles.forEach(p=>{const el=document.createElement('button');el.className='tab'+(p.id===PROFILE?' on':'');el.setAttribute('role','tab');el.setAttribute('aria-selected',p.id===PROFILE);
    el.innerHTML=`${esc(p.name[LANG])}<span class="d">${esc(p.desc[LANG])}</span>`;el.onclick=()=>{PROFILE=p.id;render();};box.appendChild(el);});
}
function currentEvents(){const prof=DATA.profiles.find(p=>p.id===PROFILE)||DATA.profiles[0];return (prof&&prof.events[LANG])||[];}
function renderTop3(){
  const t=I18N[LANG],box=document.getElementById('top3');
  const top=[...currentEvents()].sort((a,b)=>b.relevancia-a.relevancia).slice(0,3);
  box.innerHTML=`<h4>${esc(t.top3)}</h4><ol>${top.map(e=>`<li>${esc(e.titulo)} <small>· ${esc(e.editoria)} · ${t.sev} ${e.severidade}/5</small></li>`).join('')}</ol>`;
}
function renderEvents(){
  const t=I18N[LANG],box=document.getElementById('events');box.innerHTML='';
  currentEvents().forEach(e=>{
    const el=document.createElement('article');el.className='ev reveal in';const idi=(e.idioma_original||'').toUpperCase();
    el.innerHTML=`<div class="h"><span class="tag">${esc(e.editoria)} · ${esc(e.geografia)}</span>
      <span class="sev" style="color:${SEVC(e.severidade)}">${t.sev} ${e.severidade}/5</span></div>
      <h3>${esc(e.titulo)}</h3>${e.resumo?`<div class="res">${esc(e.resumo)}</div>`:''}
      <div class="act"><b>✅ ${t.acao}:</b> ${esc(e.acao_recomendada)}</div>
      <details><summary>${esc(t.detalhes)}</summary>
        <div class="grid">
          <div class="c"><b>💰 ${t.custo}</b><span>${esc(e.impacto_custo)}</span></div>
          <div class="c"><b>🔗 ${t.cadeia}</b><span>${esc(e.impacto_cadeia)}</span></div>
          <div class="c"><b>🛡️ ${t.cyber}</b><span>${esc(e.exposicao_cyber)}</span></div>
        </div>
        <div class="src"><span>${t.fonte}: ${esc(e.fonte)}${idi?` · ${idi}`:''}</span>${e.url&&e.url!=='#'?`<a href="${esc(url(e.url))}" target="_blank" rel="noopener">${t.ler}</a>`:''}</div>
      </details>`;
    box.appendChild(el);
  });
}
function renderHist(){
  const t=I18N[LANG],box=document.getElementById('hist');box.innerHTML='';const g=(DATA.generated_at||'').slice(0,10);
  DATA.profiles.forEach(p=>{const el=document.createElement('div');el.className='hrow';el.innerHTML=`<span><b>${esc(p.name[LANG])}</b> · ${g}</span><span class="lock">🔒 ${t.lock}</span>`;box.appendChild(el);});
}
function fmtVal(m,v){return (m.pre||'')+v.toLocaleString(LANG==='pt'?'pt-BR':'en-US',{minimumFractionDigits:m.dec||0,maximumFractionDigits:m.dec||0});}
const mkCards=[];
function renderMarket(){
  const box=document.getElementById('charts');box.innerHTML='';mkCards.length=0;
  if(DATA.market_error||!(DATA.market||[]).length){const t=I18N[LANG];const el=document.createElement('div');el.className='chart';el.style.gridColumn='1/-1';el.innerHTML=`<div class="label">${esc(t.mkt_err)}</div>`;box.appendChild(el);return;}
  (DATA.market||[]).forEach(m=>{const up=m.pct>=0;const el=document.createElement('div');el.className='chart reveal in';
    el.innerHTML=`<div class="top"><div><div class="label">${esc(m.name)}</div><div class="price">—</div></div><div class="chg ${up?'up':'down'}">${up?'▲ +':'▼ '}${Math.abs(m.pct).toFixed(2)}%</div></div><div class="unit">${esc((m.unit&&(m.unit[LANG]||m.unit.pt))||'')}</div><canvas></canvas>`;
    box.appendChild(el);mkCards.push({el,m,ctx:el.querySelector('canvas').getContext('2d'),price:el.querySelector('.price')});});
}
function render(){applyI18n();renderStatic();renderTabs();renderTop3();renderEvents();renderHist();renderMarket();}
render();

/* charts */
function drawLine(ctx,W,H,data,prog){
  const dpr=window.devicePixelRatio||1;ctx.canvas.width=W*dpr;ctx.canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!data||data.length<2)return data?data[data.length-1]:0;
  const lo=Math.min(...data),hi=Math.max(...data),span=(hi-lo)||1,pad=8;
  const X=i=>pad+(W-2*pad)*(i/(data.length-1)),Y=v=>H-pad-(H-2*pad)*((v-lo)/span);
  ctx.strokeStyle=cssv('--grid');ctx.lineWidth=1;for(let g=0;g<=2;g++){const y=pad+(H-2*pad)*g/2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
  const n=clamp(prog,0,1)*(data.length-1),full=Math.floor(n),frac=n-full,col=cssv('--accent');
  let ex=X(full),ey=Y(data[full]);if(full<data.length-1){ex=lerp(X(full),X(full+1),frac);ey=lerp(Y(data[full]),Y(data[full+1]),frac);}
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));for(let i=1;i<=full;i++)ctx.lineTo(X(i),Y(data[i]));ctx.lineTo(ex,ey);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');ctx.lineTo(ex,H-pad);ctx.lineTo(X(0),H-pad);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));for(let i=1;i<=full;i++)ctx.lineTo(X(i),Y(data[i]));ctx.lineTo(ex,ey);ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.shadowColor=col;ctx.shadowBlur=9;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,3.6,0,7);ctx.fill();
  return full<data.length-1?lerp(data[full],data[full+1],frac):data[data.length-1];
}
/* globe */
const CONT=[
 {c:'#4f8bff',p:[[-168,66],[-150,71],[-125,70],[-95,73],[-80,68],[-60,60],[-53,47],[-66,45],[-75,35],[-81,25],[-97,16],[-105,20],[-117,32],[-124,40],[-130,54],[-150,59],[-168,66]]},
 {c:'#36c5e0',p:[[-78,8],[-70,11],[-60,8],[-50,0],[-44,-3],[-35,-7],[-39,-15],[-48,-25],[-58,-34],[-66,-45],[-70,-52],[-74,-50],[-72,-30],[-76,-14],[-81,-5],[-79,2],[-78,8]]},
 {c:'#6aa9ff',p:[[-10,36],[-9,43],[-2,48],[2,51],[-2,58],[7,62],[18,69],[28,71],[40,67],[44,58],[42,48],[35,46],[28,41],[20,40],[14,40],[3,42],[-6,38],[-10,36]]},
 {c:'#2f7be0',p:[[-17,21],[-16,14],[-10,6],[-2,5],[8,4],[13,-5],[14,-17],[19,-34],[24,-34],[31,-29],[36,-20],[40,-15],[42,-2],[51,12],[44,11],[37,16],[34,28],[32,31],[25,32],[15,33],[2,36],[-6,35],[-13,28],[-17,21]]},
 {c:'#57d6e6',p:[[28,41],[40,42],[48,40],[55,26],[60,25],[68,24],[77,8],[80,12],[92,21],[98,9],[104,1],[109,12],[119,5],[122,15],[122,40],[135,35],[140,45],[143,53],[156,59],[180,68],[150,60],[110,73],[75,73],[55,68],[48,55],[40,48],[33,45],[28,41]]},
 {c:'#79b4ff',p:[[113,-22],[122,-18],[130,-12],[142,-11],[146,-18],[151,-24],[153,-28],[150,-37],[143,-39],[137,-36],[129,-32],[120,-34],[114,-35],[113,-28],[113,-22]]},
];
function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const land=[];for(let lat=-56;lat<=80;lat+=2.6)for(let lon=-180;lon<=180;lon+=2.6){for(const k of CONT){if(pip(lon,lat,k.p)){const la=lat*Math.PI/180,lo=lon*Math.PI/180;land.push({x:Math.cos(la)*Math.sin(lo),y:Math.sin(la),z:Math.cos(la)*Math.cos(lo),c:k.c});break;}}}
const gl=document.getElementById('globe'),gx=gl.getContext('2d');let ang=-0.3;
function rotp(p,ca,sa){return{x:p.x*ca+p.z*sa,y:p.y,z:-p.x*sa+p.z*ca};}
function drawGlobe(){const W=gl.width,H=gl.height,cx=W/2,cy=H/2,R=W*0.40;gx.clearRect(0,0,W,H);ang+=0.0022;const ca=Math.cos(ang),sa=Math.sin(ang);
  const og=gx.createRadialGradient(cx-R*.3,cy-R*.3,R*.2,cx,cy,R);og.addColorStop(0,'rgba(30,60,110,.28)');og.addColorStop(1,'rgba(6,14,30,.10)');gx.fillStyle=og;gx.beginPath();gx.arc(cx,cy,R,0,7);gx.fill();
  gx.strokeStyle=cssv('--globeline');gx.lineWidth=1;for(let m=-150;m<=180;m+=30){gx.beginPath();let s=false;for(let la=-90;la<=90;la+=4){const r=rotp({x:Math.cos(la*Math.PI/180)*Math.sin(m*Math.PI/180),y:Math.sin(la*Math.PI/180),z:Math.cos(la*Math.PI/180)*Math.cos(m*Math.PI/180)},ca,sa);if(r.z<0){s=false;continue;}const X=cx+r.x*R,Y=cy-r.y*R;s?gx.lineTo(X,Y):gx.moveTo(X,Y);s=true;}gx.stroke();}
  for(const p of land){const r=rotp(p,ca,sa);if(r.z<-0.02)continue;const d=(r.z+1)/2;gx.globalAlpha=.25+d*.75;gx.fillStyle=p.c;gx.beginPath();gx.arc(cx+r.x*R,cy-r.y*R,1.5*(.5+d),0,7);gx.fill();}gx.globalAlpha=1;}
const sky=document.getElementById('stars'),sxc=sky.getContext('2d');let stars=[];
function initStars(){sky.width=innerWidth;sky.height=innerHeight;stars=[...Array(110)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,s:Math.random()*.35+.05}));}
initStars();addEventListener('resize',initStars);
function loop(){const sy=scrollY,vh=innerHeight,dh=document.body.scrollHeight-vh;
  document.getElementById('prog').style.width=clamp(sy/dh,0,1)*100+'%';
  const ht=document.getElementById('heroText'),hp=clamp(sy/vh,0,1);ht.style.transform=`translateY(${sy*.18}px)`;ht.style.opacity=String(1-hp*.82);
  gl.style.transform=`translateY(${sy*.06}px)`;
  if(root.getAttribute('data-theme')==='dark'){sxc.clearRect(0,0,sky.width,sky.height);sxc.fillStyle=cssv('--muted');stars.forEach(st=>{st.y+=st.s;if(st.y>sky.height)st.y=0;sxc.globalAlpha=.5*st.r;sxc.beginPath();sxc.arc(st.x,(st.y+sy*.04)%sky.height,st.r,0,7);sxc.fill();});sxc.globalAlpha=1;}
  drawGlobe();
  mkCards.forEach(c=>{const r=c.el.getBoundingClientRect();const prog=clamp((vh*.9-r.top)/(vh*.5),0,1);const W=c.el.querySelector('canvas').clientWidth;c.price.textContent=fmtVal(c.m,drawLine(c.ctx,W,120,c.m.series,prog));});
  requestAnimationFrame(loop);
}
loop();
