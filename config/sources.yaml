# =============================================================================
# Fontes de ingestão — plataforma GLOBAL-FIRST, bilíngue PT/EN.
#
# Cada fonte carrega metadados para permitir cobertura global + local,
# preservação do idioma original e tradução bidirecional PT⇄EN:
#   name, url, sector, type, enabled,
#   language (idioma original: pt|en|es|...),
#   region   (global|americas|europe|asia|africa|brazil|...),
#   country  (ISO-2: US|BR|GB|... ou "" / INT p/ organismos internacionais),
#   tier     (official|media|aggregator)
#
# Todos os feeds abaixo foram VALIDADOS ao vivo. Revalide com:
#     python -m tools.validate_sources
# Para desativar sem apagar: enabled: false
# =============================================================================

defaults:
  type: rss
  timeout_seconds: 15
  user_agent: "GeoIntelMonitor/0.1 (+https://example.com)"
  language: en
  region: global
  country: ""
  tier: media
  max_entries: 40      # teto de itens por fonte (override por env MAX_ENTRIES_PER_SOURCE)
  max_age_days: 0      # 0 = desligado; >0 (env MAX_AGE_DAYS) descarta itens antigos

sources:
  # ----------------------------- ENERGIA --------------------------------------
  - name: "EIA — Today in Energy"
    url: "https://www.eia.gov/rss/todayinenergy.xml"
    sector: energia
    language: en
    region: global
    country: US
    tier: official
    enabled: true

  - name: "OilPrice — Energy News"
    url: "https://oilprice.com/rss/main"
    sector: energia
    language: en
    region: global
    country: US
    tier: media
    enabled: true

  # ----------------------------- PETRÓLEO -------------------------------------
  - name: "Rigzone — News"
    url: "https://www.rigzone.com/news/rss/rigzone_latest.aspx"
    sector: petroleo
    language: en
    region: global
    country: US
    tier: media
    enabled: true

  - name: "Google News — Oil / OPEC / Crude"
    url: "https://news.google.com/rss/search?q=oil+prices+OR+crude+oil+OR+OPEC&hl=en-US&gl=US&ceid=US:en"
    sector: petroleo
    language: en
    region: global
    country: ""
    tier: aggregator
    enabled: true

  # ------------------------------- CYBER --------------------------------------
  - name: "CISA — Cybersecurity Advisories"
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
    sector: cyber
    language: en
    region: global
